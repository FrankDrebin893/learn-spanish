name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish SpanishWordLearner.csproj -c Release -o publish

      - name: Configure Base Href for GitHub Pages
        run: |
          # Replace <base href="/" /> with repository subpath for GitHub Pages hosting
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i 's|<base href="/" />|<base href="/'"$REPO_NAME"'/" />|g' publish/wwwroot/index.html
          # Also ensure 404.html exists in publish directory
          cp publish/wwwroot/404.html publish/wwwroot/404.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publish/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
