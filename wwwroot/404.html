<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aprende Español</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License: https://github.com/rafgraph/spa-github-pages
        // Set pathSegmentsToKeep to 1 for project pages (e.g. username.github.io/repo-name), 0 for root / custom domains
        var isGitHubPagesProject = window.location.hostname.endsWith('github.io') && !window.location.hostname.startsWith('localhost');
        var pathSegmentsToKeep = isGitHubPagesProject ? 1 : 0;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
