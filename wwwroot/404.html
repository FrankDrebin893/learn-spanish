<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aprende Español</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License: https://github.com/rafgraph/spa-github-pages
        //
        // On GitHub Pages or custom domain static hosting (e.g. hojte.net/SpanishWordLearningApp/),
        // check whether the URL starts with the repository/project subpath or an application route.
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var knownRoutes = ['learn', 'quiz', 'statistics', 'error'];

        var pathSegmentsToKeep = 0;
        if (segments.length > 0) {
            var firstSegment = segments[0].toLowerCase();
            // If the first segment is explicitly learn-spanish or spanishwordlearningapp, or is NOT an internal SPA page route,
            // it represents the project repository subpath on the domain (keep 1 segment).
            if (firstSegment === 'learn-spanish' || firstSegment === 'spanishwordlearningapp' || !knownRoutes.includes(firstSegment)) {
                pathSegmentsToKeep = 1;
            }
        }

        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
